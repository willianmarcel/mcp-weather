apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-mcp
  namespace: pocs
  labels:
    app: weather-mcp
    version: "0.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-mcp
  template:
    metadata:
      labels:
        app: weather-mcp
        version: "0.1"
    spec:
      containers:
      - name: weather-mcp
        image: wborges/mcp-weather:0.3
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: mcp
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: OPENWEATHERMAP_API_KEY
          value: ""
        - name: MCP_SERVER_PORT
          value: "8081"
        - name: HEALTH_CHECK_PORT
          value: "8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false

---

apiVersion: v1
kind: Service
metadata:
  name: weather-mcp-service
  namespace: pocs
  labels:
    app: weather-mcp
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  - port: 8081
    targetPort: 8081
    name: mcp
  selector:
    app: weather-mcp
