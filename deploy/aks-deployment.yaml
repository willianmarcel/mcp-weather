apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-mcp
  namespace: pocs
  labels:
    app: weather-mcp
    version: "0.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-mcp
  template:
    metadata:
      labels:
        app: weather-mcp
        version: "0.1"
    spec:
      containers:
      - name: weather-mcp
        image: wborges/mcp-weather:0.3
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: mcp
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: OPENWEATHERMAP_API_KEY
          value: "b851467c40a5692e35d599b1f3d42db3"
        - name: MCP_SERVER_PORT
          value: "8081"
        - name: HEALTH_CHECK_PORT
          value: "8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false

---

apiVersion: v1
kind: Service
metadata:
  name: weather-mcp-service
  namespace: pocs
  labels:
    app: weather-mcp
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  - port: 8081
    targetPort: 8081
    name: mcp
  selector:
    app: weather-mcp

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-mcp-ingress
  namespace: pocs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dev
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self' 'unsafe-eval' 'unsafe-inline' *.avanade.ai; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.botframework.com *.jsdelivr.net; img-src 'self' *.avanade.ai data:; connect-src 'self' *.avanade.ai https://*.avanade.ai wss://*.avanade.ai ws://*.avanade.ai *.microsoftonline.com *.microsoft.com *.blob.core.windows.net; font-src 'self' data: *.avanade.ai *.gstatic.com fonts.gstatic.com; style-src 'self' 'unsafe-inline' *.googleapis.com fonts.googleapis.com *.jsdelivr.net; media-src 'self' *.avanade.ai *.blob.core.windows.net; upgrade-insecure-requests; block-all-mixed-content;" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Cache-Control "no-store" always;
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - weather-dev.cockpit.avanade.ai
    secretName: letsencrypt-mcp-dev
  rules:
  - host: weather-dev.cockpit.avanade.ai
    http:     
      paths:
      - path: /health
        pathType: Exact
        backend:
          service:
            name: weather-mcp-service
            port:
              number: 80
      - path: /mcp
        pathType: Exact
        backend:
          service:
            name: weather-mcp-service
            port:
              number: 80
